name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Resolve version from module.prop
        id: ver
        run: |
          PROP_VER=$(grep '^version=' module.prop | cut -d= -f2)
          PROP_VC=$(grep '^versionCode=' module.prop | cut -d= -f2)
          echo "prop_ver=${PROP_VER}" >> "$GITHUB_OUTPUT"
          echo "prop_vc=${PROP_VC}" >> "$GITHUB_OUTPUT"
          echo "tag=${PROP_VER}" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        run: |
          PROP_VER="${{ steps.ver.outputs.prop_ver }}"
          PROP_VC="${{ steps.ver.outputs.prop_vc }}"
          JSON_VER=$(python3 -c "import json; print(json.load(open('update.json'))['version'])")
          JSON_VC=$(python3 -c "import json; print(json.load(open('update.json'))['versionCode'])")
          ERRORS=0
          [ "${PROP_VER}" != "${JSON_VER}" ] && echo "::error::module.prop version ${PROP_VER} != update.json version ${JSON_VER}" && ERRORS=$((ERRORS+1))
          [ "${PROP_VC}" != "${JSON_VC}" ] && echo "::error::module.prop versionCode ${PROP_VC} != update.json versionCode ${JSON_VC}" && ERRORS=$((ERRORS+1))
          grep -q "^## ${PROP_VER}$" CHANGELOG.md || echo "::warning::CHANGELOG.md has no section for ${PROP_VER}"
          [ "${ERRORS}" -gt 0 ] && exit 1
          echo "Version consistency OK"

      - name: Check update-binary freshness
        run: |
          curl -sL https://raw.githubusercontent.com/topjohnwu/Magisk/master/scripts/module_installer.sh \
            | diff - META-INF/com/google/android/update-binary \
            || echo "::warning::update-binary differs from upstream Magisk"

      - name: Verify updater-script
        run: |
          [ "$(cat META-INF/com/google/android/updater-script)" = "#MAGISK" ] \
            || { echo "::error::updater-script must contain exactly '#MAGISK'"; exit 1; }

      - name: Build zip
        run: |
          ZIP_NAME="tether_spoofer-${{ steps.ver.outputs.prop_ver }}.zip"
          zip -r "${ZIP_NAME}" . \
            -x '.git/*' '*.zip' 'Makefile' 'README.md' 'CHANGELOG.md' \
               'update.json' '.github/*' '.gitignore' 'module.prop.bak'
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Verify zip contents
        run: |
          unzip -l "${ZIP_NAME}"
          if unzip -l "${ZIP_NAME}" | grep -qE '\.git/|Makefile|README\.md|CHANGELOG\.md|\.github/|update\.json'; then
            echo "::error::Dev files found in zip"
            exit 1
          fi
          # Проверка обязательных файлов Magisk-модуля
          for f in module.prop META-INF/com/google/android/update-binary META-INF/com/google/android/updater-script; do
            unzip -l "${ZIP_NAME}" | grep -q " ${f}$" || { echo "::error::missing ${f} in zip"; exit 1; }
          done

      - name: Extract release notes from CHANGELOG.md
        run: |
          TAG="${{ steps.ver.outputs.prop_ver }}"
          if grep -q "^## ${TAG}$" CHANGELOG.md; then
            awk -v tag="## ${TAG}" '
              $0 == tag { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > /tmp/release-notes.txt
          else
            echo "Release ${TAG}" > /tmp/release-notes.txt
          fi

      - name: Delete existing tag/release if present
        run: |
          TAG="${{ steps.ver.outputs.prop_ver }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Deleting existing release ${TAG}"
            gh release delete "${TAG}" --yes
          fi
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Deleting existing tag ${TAG}"
            git push origin ":refs/tags/${TAG}" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.prop_ver }}
          name: ${{ steps.ver.outputs.prop_ver }}
          body_path: /tmp/release-notes.txt
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: false
